# ===================================================================
# DATASOURCE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# FIX: Explicitly set dialect so Hibernate doesn't fail metadata connection on startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Reveal low-level driver connection errors in Render logs
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.mysql.cj=DEBUG

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=${PORT:5000}
# Gmail Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true