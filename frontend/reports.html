<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="reports.css">
</head>
<body>

<nav>
    <h2>📊 Reports Dashboard</h2>

    <a href="hospital.html">← Back to Dashboard</a>
</nav>

<div class="container">

    <div class="chart-card">
        <h2>📈 Monthly Requests</h2>
        <canvas id="monthlyRequestsChart"></canvas>
    </div>

    <div class="chart-card">
        <h2>🩸 Blood Group Distribution</h2>
        <canvas id="bloodGroupChart"></canvas>
    </div>

    <div class="chart-card">
        <h2>👥 Donor Growth</h2>
        <canvas id="donorGrowthChart"></canvas>
    </div>

</div>

<script>

// Monthly Requests
new Chart(
document.getElementById("monthlyRequestsChart"),
{
    type:"bar",
    data:{
        labels:["Jan","Feb","Mar","Apr","May","Jun"],
        datasets:[{
            label:"Requests",
            data:[12,18,25,30,22,35]
        }]
    }
});

// Blood Group Distribution
new Chart(
document.getElementById("bloodGroupChart"),
{
    type:"pie",
    data:{
        labels:["A+","A-","B+","B-","AB+","AB-","O+","O-"],
        datasets:[{
            data:[25,8,18,5,12,3,30,6]
        }]
    }
});

// Donor Growth
new Chart(
document.getElementById("donorGrowthChart"),
{
    type:"line",
    data:{
        labels:["Jan","Feb","Mar","Apr","May","Jun"],
        datasets:[{
            label:"Donors",
            data:[50,80,120,170,220,280],
            fill:false
        }]
    }
});

</script>

</body>
</html>
