<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reports Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        nav {
            background: linear-gradient(135deg, #b71c1c, #e53935);
            color: white;
            padding: 25px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            width: 92%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .summary-container {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 25px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            border-left: 6px solid #d32f2f;
        }

        .summary-card h3 {
            margin-top: 0;
            color: #555;
        }

        .summary-card p {
            font-size: 40px;
            font-weight: bold;
            color: #d32f2f;
            margin: 10px 0 0;
        }

        .chart-card {
            background: white;
            padding: 30px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            margin-bottom: 30px;
        }

        .chart-card h2 {
            margin-top: 0;
            color: #b71c1c;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        .message {
            text-align: center;
            padding: 30px;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
        }

        @media(max-width: 700px) {

            nav {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>


<body>


<nav>

    <h2>📊 Reports Dashboard</h2>

    <a href="admin.html">
        ← Back to Admin
    </a>

</nav>


<div class="container">


    <!-- ========================================= -->
    <!-- SUMMARY -->
    <!-- ========================================= -->

    <div class="summary-container">

        <div class="summary-card">

            <h3>
                🩸 Approved Donors
            </h3>

            <p id="totalDonors">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                ⏳ Pending Registrations
            </h3>

            <p id="pendingRegistrations">
                0
            </p>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- BLOOD GROUP -->
    <!-- ========================================= -->

    <div class="chart-card">

        <h2>
            🩸 Approved Donors by Blood Group
        </h2>

        <div class="chart-container">

            <canvas id="bloodGroupChart"></canvas>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- CITY -->
    <!-- ========================================= -->

    <div class="chart-card">

        <h2>
            📍 Approved Donors by City
        </h2>

        <div class="chart-container">

            <canvas id="cityChart"></canvas>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- STATUS -->
    <!-- ========================================= -->

    <div
        id="message"
        class="message">
    </div>


</div>


<script>


// =====================================================
// API
// =====================================================

const REGISTRATION_API =
    "http://localhost:5000/api/registrations";


// =====================================================
// GLOBAL
// =====================================================

let bloodGroupChart = null;

let cityChart = null;


// =====================================================
// LOAD APPROVED DONORS
// =====================================================

async function loadApprovedDonors() {

    try {

        const response =
            await fetch(
                `${REGISTRATION_API}/donors/approved`
            );


        const text =
            await response.text();


        console.log(
            "Approved donors response:",
            text
        );


        if (!response.ok) {

            throw new Error(
                `Server error: ${response.status}`
            );

        }


        const donors =
            JSON.parse(text);


        console.log(
            "Approved donors:",
            donors
        );


        document.getElementById(
            "totalDonors"
        ).innerText =
            donors.length;


        /*
         * IMPORTANT:
         *
         * Your current PendingRegistrationResponse
         * contains only:
         *
         * id
         * name
         * email
         * role
         * createdAt
         * status
         *
         * Therefore blood group and city are not
         * available here.
         */


        createBloodGroupChart(donors);

        createCityChart(donors);


    } catch (error) {

        console.error(
            "Approved donor error:",
            error
        );


        document.getElementById(
            "totalDonors"
        ).innerText =
            "Error";


        document.getElementById(
            "message"
        ).innerHTML = `
            <span class="error">
                ❌ Failed to load approved donors:
                ${escapeHtml(error.message)}
            </span>
        `;

    }

}


// =====================================================
// LOAD PENDING REGISTRATIONS
// =====================================================

async function loadPendingRegistrations() {

    try {

        const response =
            await fetch(
                `${REGISTRATION_API}/pending`
            );


        const text =
            await response.text();


        console.log(
            "Pending registrations response:",
            text
        );


        if (!response.ok) {

            throw new Error(
                `Server error: ${response.status}`
            );

        }


        const registrations =
            JSON.parse(text);


        document.getElementById(
            "pendingRegistrations"
        ).innerText =
            registrations.length;


    } catch (error) {

        console.error(
            "Pending registration error:",
            error
        );


        document.getElementById(
            "pendingRegistrations"
        ).innerText =
            "Error";

    }

}


// =====================================================
// BLOOD GROUP CHART
// =====================================================

function createBloodGroupChart(donors) {

    const groups = [

        "A+",
        "A-",
        "B+",
        "B-",
        "AB+",
        "AB-",
        "O+",
        "O-"

    ];


    const counts =
        groups.map(group => {

            return donors.filter(
                donor =>
                    donor.bloodGroup === group ||
                    donor.blood_group === group
            ).length;

        });


    const canvas =
        document.getElementById(
            "bloodGroupChart"
        );


    if (bloodGroupChart) {

        bloodGroupChart.destroy();

    }


    bloodGroupChart =
        new Chart(canvas, {

            type: "bar",

            data: {

                labels: groups,

                datasets: [{

                    label:
                        "Approved Donors",

                    data: counts

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {
                            stepSize: 1
                        }

                    }

                }

            }

        });

}


// =====================================================
// CITY CHART
// =====================================================

function createCityChart(donors) {

    const cityCounts = {};


    donors.forEach(donor => {

        const city =
            donor.city ||
            "Unknown";


        if (!cityCounts[city]) {

            cityCounts[city] = 0;

        }


        cityCounts[city]++;

    });


    const labels =
        Object.keys(cityCounts);


    const counts =
        Object.values(cityCounts);


    const canvas =
        document.getElementById(
            "cityChart"
        );


    if (cityChart) {

        cityChart.destroy();

    }


    cityChart =
        new Chart(canvas, {

            type: "bar",

            data: {

                labels:
                    labels.length
                        ? labels
                        : ["No Data"],

                datasets: [{

                    label:
                        "Approved Donors",

                    data:
                        counts.length
                            ? counts
                            : [0]

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {
                            stepSize: 1
                        }

                    }

                }

            }

        });

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// =====================================================
// LOAD EVERYTHING
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadApprovedDonors();

        loadPendingRegistrations();

    }
);


</script>


</body>

</html>
