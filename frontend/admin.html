<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        color: #333;
    }

    header {
        background: linear-gradient(
            135deg,
            #b71c1c,
            #e53935
        );

        color: white;
        padding: 25px 40px;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        margin: 0;
    }

    .admin-info {
        text-align: right;
    }

    .container {
        width: 90%;
        max-width: 1200px;
        margin: 30px auto;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: white;
        padding: 25px;
        border-radius: 15px;

        box-shadow:
            0 5px 20px rgba(0,0,0,0.08);

        text-align: center;
    }

    .stat-card h3 {
        margin: 0 0 10px;
        color: #555;
    }

    .stat-number {
        font-size: 35px;
        font-weight: bold;
        color: #c62828;
    }

    .section-title {
        margin-bottom: 20px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    button {
        padding: 25px;
        border: none;
        border-radius: 12px;

        background: #d32f2f;
        color: white;

        font-size: 17px;
        cursor: pointer;

        transition: 0.2s;
    }

    button:hover {
        background: #b71c1c;
        transform: translateY(-2px);
    }

    .logout {
        background: #333;
    }

    .logout:hover {
        background: #111;
    }

    .emergency {
        margin-top: 35px;

        background: #fff;

        border-left: 6px solid #d32f2f;

        border-radius: 12px;

        padding: 25px;

        box-shadow:
            0 5px 20px rgba(0,0,0,0.08);
    }

    .emergency h2 {
        margin-top: 0;
        color: #b71c1c;
    }

    .quick {
        margin-top: 30px;

        background: white;

        padding: 25px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px rgba(0,0,0,0.08);
    }

    .quick button {
        padding: 15px 20px;

        margin-right: 10px;
        margin-bottom: 10px;

        font-size: 15px;
    }

    @media(max-width:900px) {

        .stats {
            grid-template-columns: repeat(2, 1fr);
        }

        .buttons {
            grid-template-columns: repeat(2, 1fr);
        }

    }

    @media(max-width:600px) {

        .stats,
        .buttons {
            grid-template-columns: 1fr;
        }

        header {
            flex-direction: column;
            text-align: center;
            gap: 10px;
        }

        .admin-info {
            text-align: center;
        }

    }
    .compatibility-btn {
    background: #7c3aed;
}

.compatibility-btn:hover {
    background: #6d28d9;
}
.compatibility-btn {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.compatibility-btn:hover {
    background: #6d28d9;
}
.top-nav {
    position: absolute;
    top: 15px;
    right: 20px;
    z-index: 1000;
}

.top-nav button {
    background: #333;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.top-nav button:hover {
    background: #555;
}
</style>

</head>

<body>
<div class="top-nav">
    <button onclick="goBack()">
        ← Back
    </button>
</div>
<header>

<div>

    <h1>
        🛡️ Admin Dashboard
    </h1>

    <p>
        Blood Donation Management System
    </p>

</div>

<div class="admin-info">

    👤 Administrator

    <br>

    <small>
        System Control Panel
    </small>

</div>

</header>



<!-- ============================= -->
<!-- ADMIN MENU -->
<!-- ============================= -->

<h2 class="section-title">
    ⚙️ Admin Menu
</h2>


<div class="buttons">


    <button
        onclick="registrationRequests()">

        📋
        <br>

        Donor Requests

    </button>


    <button
        onclick="donors()">

        🩸
        <br>

        Approved Donors

    </button>


    <button
        onclick="approvedBloodRequests()">

        🏥
        <br>

        Approved Hospitals

    </button>


    <button
        onclick="bloodStatistics()">

        📊
        <br>

        Blood Group Statistics

    </button>


    <button
        onclick="reports()">

        📄
        <br>

        Reports

    </button>


    <button
        onclick="window.location.href='reportpd.html'">

        📄
        <br>

        Download Reports as PDF

    </button>


    <button
        onclick="notifications()">

        🔔
        <br>

        Notifications

    </button>


    <button
        onclick="patientRequests()">

        🏥
        <br>

        Patient Blood Requests

    </button>


    <button
        class="logout"
        onclick="logout()">

        🚪
        <br>

        Logout

    </button>


</div>


<button
    class="compatibility-btn"
    onclick="window.location.href='matching-requests.html'">

    🔎 Find Matching Requests

</button>


<!-- ============================= -->
<!-- QUICK ACTIONS -->
<!-- ============================= -->

<div class="quick">

    <h2>
        ⚡ Quick Actions
    </h2>


    <button
        onclick="registrationRequests()">

        Review Registrations

    </button>


    <button
        onclick="donors()">

        View Donors

    </button>


    <button
        onclick="approvedBloodRequests()">

        View Approved Hospitals

    </button>


    <button
        onclick="patientRequests()">

        View Patient Requests

    </button>

</div><button
    class="compatibility-btn"
    onclick="window.location.href='compatibility.html'">

    🩸 Compatibility Checking

</button>

</div>

<script>

function goBack() {
    window.location.href = "index.html";
}
// =====================================================
// REGISTRATION REQUESTS
// =====================================================

function registrationRequests() {

    window.location.href =
        "admin-registrations.html";

}


// =====================================================
// APPROVED DONORS
// =====================================================

function donors() {

    window.location.href =
        "donors.html";

}


// =====================================================
// APPROVED BLOOD REQUESTS / HOSPITALS
// =====================================================

function approvedBloodRequests() {

    window.location.href =
        "approved-hospitals.html";

}


// =====================================================
// BLOOD STATISTICS
// =====================================================

function bloodStatistics() {

    window.location.href =
        "blood-statistics.html";

}


// =====================================================
// REPORTS
// =====================================================

function reports() {

    window.location.href =
        "reports.html";

}


// =====================================================
// NOTIFICATIONS
// =====================================================

function notifications() {

    window.location.href =
        "notifications.html";

}


// =====================================================
// PATIENT REQUESTS
// =====================================================

function patientRequests() {

    window.location.href =
        "patient-requests.html";

}


// =====================================================
// EMERGENCY REQUESTS
// =====================================================

function emergencyRequests() {

    window.location.href =
        "emergency-requests.html";

}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.removeItem(
        "adminLoggedIn"
    );

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}


// =====================================================
// LOAD DASHBOARD STATISTICS
// =====================================================

async function loadStatistics() {

    try {

        // ==========================================
        // PENDING REGISTRATIONS
        // ==========================================

        const pendingResponse =
            await fetch(
                "http://localhost:5000/api/registrations/pending"
            );

        if (pendingResponse.ok) {

            const pending =
                await pendingResponse.json();

            document.getElementById(
                "pendingCount"
            ).innerText =
                pending.length;
        }


        // ==========================================
        // APPROVED DONORS
        // ==========================================

        const donorResponse =
            await fetch(
                "http://localhost:5000/api/donors/approved"
            );

        if (donorResponse.ok) {

            const donorsData =
                await donorResponse.json();

            document.getElementById(
                "donorCount"
            ).innerText =
                donorsData.length;
        }


        // ==========================================
        // APPROVED HOSPITALS
        // ==========================================

        const hospitalResponse =
            await fetch(
                "http://localhost:5000/api/registrations/hospitals/approved"
            );

        if (hospitalResponse.ok) {

            const hospitalsData =
                await hospitalResponse.json();

            document.getElementById(
                "hospitalCount"
            ).innerText =
                hospitalsData.length;
        }


        // ==========================================
        // PENDING BLOOD REQUESTS
        // ==========================================

        const requestResponse =
    await fetch(
        "http://localhost:5000/api/blood-requests/pending"
    );

if (requestResponse.ok) {

    const requests =
        await requestResponse.json();

    document.getElementById(
        "pendingRequestCount"
    ).innerText =
        requests.length;
}


    } catch (error) {

        console.error(
            "Statistics error:",
            error
        );

    }

}
async function loadBloodRequests() {

    try {

        const response = await fetch(
            "http://localhost:5000/api/blood-requests/pending"
        );

        if (!response.ok) {
            throw new Error("Failed to load blood requests");
        }

        const requests = await response.json();

        const container =
            document.getElementById("bloodRequests");

        if (!container) {
            console.error("bloodRequests container not found");
            return;
        }

        if (requests.length === 0) {

            container.innerHTML =
                "<p>No pending blood requests.</p>";

            return;
        }

        container.innerHTML = requests.map(request => `

            <div class="request-card">

                <h3>
                    🏥 ${escapeHtml(
                        request.hospitalName || "Hospital"
                    )}
                </h3>

                <p>
                    <strong>Request ID:</strong>
                    #${request.id}
                </p>

                <p>
                    <strong>Patient:</strong>
                    ${escapeHtml(
                        request.patientName || "Not provided"
                    )}
                </p>

                <p>
                    <strong>Blood Group:</strong>
                    🩸 ${escapeHtml(
                        request.bloodGroup || "Not provided"
                    )}
                </p>

                <p>
                    <strong>Age:</strong>
                    ${request.age ?? "Not provided"}
                </p>

                <p>
                    <strong>Gender:</strong>
                    ${escapeHtml(
                        request.gender || "Not provided"
                    )}
                </p>

                <p>
                    <strong>Patient Status:</strong>
                    ${escapeHtml(
                        request.patientStatus || "Not provided"
                    )}
                </p>

                <p>
                    <strong>Blood Units:</strong>
                    ${request.unitsRequired ?? "Not provided"}
                </p>

                <p>
                    <strong>City:</strong>
                    📍 ${escapeHtml(
                        request.city || "Not provided"
                    )}
                </p>

                <p>
                    <strong>Phone:</strong>
                    📞 ${escapeHtml(
                        request.phone || "Not provided"
                    )}
                </p>

                <p>
                    <strong>Reason:</strong>
                    ${escapeHtml(
                        request.reason || "Not provided"
                    )}
                </p>

                <p>
                    <strong>Status:</strong>

                    <span class="status pending">
                        ${escapeHtml(
                            request.status || "Pending"
                        )}
                    </span>

                </p>

                <div class="request-actions">

                    <button
                        onclick="approveRequest(${request.id})">

                        ✅ Approve

                    </button>

                    <button
                        onclick="rejectRequest(${request.id})">

                        ❌ Reject

                    </button>

                </div>

            </div>

        `).join("");

    } catch (error) {

        console.error(
            "Blood request loading error:",
            error
        );

        const container =
            document.getElementById("bloodRequests");

        if (container) {

            container.innerHTML =
                "<p>❌ Failed to load blood requests.</p>";

        }

    }
}
function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}
async function approveRequest(id) {

    try {

        const response = await fetch(
            `http://localhost:5000/api/blood-requests/approve/${id}`,
            {
                method: "PUT"
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "Failed to approve request."
            );

            return;
        }

        alert(
            "✅ Blood request approved successfully!"
        );

        loadBloodRequests();

        loadStatistics();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Failed to approve blood request."
        );
    }
}


async function rejectRequest(id) {

    try {

        const response = await fetch(
            `http://localhost:5000/api/blood-requests/reject/${id}`,
            {
                method: "PUT"
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "Failed to reject request."
            );

            return;
        }

        alert(
            "❌ Blood request rejected."
        );

        loadBloodRequests();

        loadStatistics();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Failed to reject blood request."
        );
    }
}

</script>
</body>

</html>
