<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Approved Donors</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #b71c1c, #e53935);
            color: white;
            padding: 30px 50px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 17px;
        }

        .container {
            width: 92%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .back {
            background: #333;
        }

        .refresh {
            background: #1976d2;
        }

        .donors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .donor-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border-left: 6px solid #d32f2f;
        }

        .donor-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .donor-card h2 {
            margin: 0 0 15px;
            color: #b71c1c;
        }

        .donor-card p {
            margin: 10px 0;
            font-size: 16px;
        }

        .blood-group {
            display: inline-block;
            background: #fee2e2;
            color: #b91c1c;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 5px;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 7px 13px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* ==========================================
           ACTION BUTTONS
           ========================================== */

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .edit-btn {
            flex: 1;
            background: #1976d2;
        }

        .edit-btn:hover {
            background: #125ca1;
        }

        .delete-btn {
            flex: 1;
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            background: white;
            padding: 60px;
            text-align: center;
            border-radius: 15px;
            color: #777;
            grid-column: 1 / -1;
        }

        .error {
            color: #b91c1c;
        }


        /* ==========================================
           EDIT MODAL
           ========================================== */

        .modal {
            display: none;

            position: fixed;
            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.55);

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.25);

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #b71c1c;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;

            border: 2px solid #ddd;
            border-radius: 8px;

            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d32f2f;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn {
            flex: 1;
            background: #16a34a;
        }

        .save-btn:hover {
            background: #15803d;
        }

        .cancel-btn {
            flex: 1;
            background: #555;
        }

        .cancel-btn:hover {
            background: #333;
        }


        /* ==========================================
           MESSAGE
           ========================================== */

        #message {
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }


        @media(max-width: 700px) {

            header {
                padding: 25px;
            }

            .container {
                width: 94%;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .actions {
                flex-direction: column;
            }

            .modal-buttons {
                flex-direction: column;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>🩸 Approved Donors</h1>

    <p>
        Donors approved by the administrator
    </p>

</header>


<div class="container">


    <div class="top-bar">

        <button
            class="back"
            onclick="goBack()">

            ← Admin Dashboard

        </button>


        <button
            class="refresh"
            onclick="loadDonors()">

            🔄 Refresh Donors

        </button>

    </div>


    <div id="message"></div>


    <h2>
        Approved Donor List
    </h2>


    <div
        id="donorsContainer"
        class="donors">

        <div class="empty">
            Loading approved donors...
        </div>

    </div>

</div>


<!-- ==========================================
     EDIT DONOR MODAL
     ========================================== -->

<div
    id="editModal"
    class="modal">


    <div class="modal-content">

        <h2>
            ✏️ Edit Donor
        </h2>


        <input
            type="hidden"
            id="editId">


        <div class="form-group">

            <label>
                Name
            </label>

            <input
                type="text"
                id="editName"
                required>

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="editEmail"
                required>

        </div>


        <div class="form-group">

            <label>
                Age
            </label>

            <input
                type="number"
                id="editAge"
                min="1"
                max="120"
                required>

        </div>


        <div class="form-group">

            <label>
                Gender
            </label>

            <select id="editGender">

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Blood Group
            </label>

            <select id="editBloodGroup">

                <option value="">
                    Select Blood Group
                </option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>

        </div>


        <div class="form-group">

            <label>
                City
            </label>

            <select id="editCity">

                <option value="">
                    Select City
                </option>

                <option value="Thiruvananthapuram">
                    Thiruvananthapuram
                </option>

                <option value="Kollam">
                    Kollam
                </option>

                <option value="Pathanamthitta">
                    Pathanamthitta
                </option>

                <option value="Alappuzha">
                    Alappuzha
                </option>

                <option value="Kottayam">
                    Kottayam
                </option>

                <option value="Idukki">
                    Idukki
                </option>

                <option value="Ernakulam">
                    Ernakulam
                </option>

                <option value="Thrissur">
                    Thrissur
                </option>

                <option value="Palakkad">
                    Palakkad
                </option>

                <option value="Malappuram">
                    Malappuram
                </option>

                <option value="Kozhikode">
                    Kozhikode
                </option>

                <option value="Wayanad">
                    Wayanad
                </option>

                <option value="Kannur">
                    Kannur
                </option>

                <option value="Kasaragod">
                    Kasaragod
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Phone
            </label>

            <input
                type="tel"
                id="editPhone"
                required>

        </div>


        <div class="modal-buttons">

            <button
                class="save-btn"
                onclick="saveDonor()">

                💾 Save Changes

            </button>


            <button
                class="cancel-btn"
                onclick="closeEditModal()">

                ✕ Cancel

            </button>

        </div>

    </div>

</div>


<script>


const API_URL =
    "http://localhost:5000/api/donors";


// ==========================================
// BACK TO ADMIN
// ==========================================

function goBack() {

    window.location.href =
        "admin.html";

}


// ==========================================
// LOAD APPROVED DONORS
// ==========================================

async function loadDonors() {

    const container =
        document.getElementById(
            "donorsContainer"
        );


    container.innerHTML = `

        <div class="empty">

            Loading approved donors...

        </div>

    `;


    try {

        const response =
            await fetch(
                `${API_URL}/approved`
            );


        const text =
            await response.text();


        console.log(
            "Approved donors response:",
            text
        );


        let donors = [];


        try {

            donors =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Backend returned invalid JSON"
            );

        }


        if (!response.ok) {

            throw new Error(
                donors.message ||
                `Server error: ${response.status}`
            );

        }


        displayDonors(donors);


    } catch (error) {

        console.error(
            "Donor loading error:",
            error
        );


        container.innerHTML = `

            <div class="empty error">

                <h2>
                    ❌ Failed to load approved donors
                </h2>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

                <p>
                    Check that the Java backend
                    is running on localhost:5000.
                </p>

            </div>

        `;

    }

}


// ==========================================
// DISPLAY DONORS
// ==========================================

function displayDonors(donors) {

    const container =
        document.getElementById(
            "donorsContainer"
        );


    if (
        !donors ||
        donors.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    🩸 No Approved Donors
                </h2>

                <p>
                    There are currently
                    no approved donors.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    donors.forEach(donor => {

        const card =
            document.createElement("div");


        card.className =
            "donor-card";


        card.innerHTML = `

            <div class="donor-icon">
                🩸
            </div>


            <h2>
                ${escapeHtml(
                    donor.name ||
                    "Donor"
                )}
            </h2>


            <p>

                <strong>
                    Donor ID:
                </strong>

                ${donor.id ?? "N/A"}

            </p>


            <p>

                <strong>
                    🩸 Blood Group:
                </strong>

                <span class="blood-group">

                    ${escapeHtml(
                        donor.bloodGroup ||
                        "Not provided"
                    )}

                </span>

            </p>


            <p>

                <strong>
                    Age:
                </strong>

                ${donor.age ??
                    "Not provided"}

            </p>


            <p>

                <strong>
                    Gender:
                </strong>

                ${escapeHtml(
                    donor.gender ||
                    "Not provided"
                )}

            </p>


            <p>

                <strong>
                    Email:
                </strong>

                ${escapeHtml(
                    donor.email ||
                    "Not provided"
                )}

            </p>


            <p>

                <strong>
                    Phone:
                </strong>

                ${escapeHtml(
                    donor.phone ||
                    "Not provided"
                )}

            </p>


            <p>

                <strong>
                    City:
                </strong>

                ${escapeHtml(
                    donor.city ||
                    "Not provided"
                )}

            </p>


            <p>

                <strong>
                    Status:
                </strong>

                <span class="status">
                    Approved
                </span>

            </p>


            <div class="actions">

                <button
                    class="edit-btn"
                    onclick='openEditModal(
                        ${JSON.stringify(donor)}
                    )'>

                    ✏️ Edit

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteDonor(
                        ${donor.id}
                    )">

                    🗑️ Delete

                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


// ==========================================
// OPEN EDIT MODAL
// ==========================================

function openEditModal(donor) {

    document.getElementById(
        "editId"
    ).value =
        donor.id ?? "";


    document.getElementById(
        "editName"
    ).value =
        donor.name ?? "";


    document.getElementById(
        "editEmail"
    ).value =
        donor.email ?? "";


    document.getElementById(
        "editAge"
    ).value =
        donor.age ?? "";


    document.getElementById(
        "editGender"
    ).value =
        donor.gender ?? "";


    document.getElementById(
        "editBloodGroup"
    ).value =
        donor.bloodGroup ?? "";


    document.getElementById(
        "editCity"
    ).value =
        donor.city ?? "";


    document.getElementById(
        "editPhone"
    ).value =
        donor.phone ?? "";


    document.getElementById(
        "editModal"
    ).style.display =
        "flex";

}


// ==========================================
// CLOSE EDIT MODAL
// ==========================================

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).style.display =
        "none";

}


// ==========================================
// SAVE DONOR
// ==========================================

async function saveDonor() {

    const id =
        document.getElementById(
            "editId"
        ).value;


    const donorData = {

        name:
            document.getElementById(
                "editName"
            ).value.trim(),

        email:
            document.getElementById(
                "editEmail"
            ).value.trim(),

        age:
            Number(
                document.getElementById(
                    "editAge"
                ).value
            ),

        gender:
            document.getElementById(
                "editGender"
            ).value,

        bloodGroup:
            document.getElementById(
                "editBloodGroup"
            ).value,

        city:
            document.getElementById(
                "editCity"
            ).value,

        phone:
            document.getElementById(
                "editPhone"
            ).value.trim()

    };


    if (
        !donorData.name ||
        !donorData.email ||
        !donorData.age ||
        !donorData.gender ||
        !donorData.bloodGroup ||
        !donorData.city ||
        !donorData.phone
    ) {

        alert(
            "Please fill all donor fields."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            donorData
                        )
                }
            );


        const text =
            await response.text();


        console.log(
            "Update donor response:",
            text
        );


        let result = {};


        try {

            result =
                JSON.parse(text);

        } catch {

            result = {};

        }


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Update failed: ${response.status}`
            );

        }


        alert(
            "✅ Donor updated successfully!"
        );


        closeEditModal();


        loadDonors();


    } catch (error) {

        console.error(
            "Update donor error:",
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }

}


// ==========================================
// DELETE DONOR
// ==========================================

async function deleteDonor(id) {

    const confirmed =
        confirm(
            "⚠️ Are you sure you want to delete this donor?\n\n" +
            "This action cannot be undone."
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "DELETE"
                }
            );


        const text =
            await response.text();


        console.log(
            "Delete donor response:",
            text
        );


        let result = {};


        try {

            result =
                JSON.parse(text);

        } catch {

            result = {};

        }


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Delete failed: ${response.status}`
            );

        }


        alert(
            result.message ||
            "✅ Donor deleted successfully!"
        );


        loadDonors();


    } catch (error) {

        console.error(
            "Delete donor error:",
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


// ==========================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// ==========================================

window.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "editModal"
            );


        if (event.target === modal) {

            closeEditModal();

        }

    }
);


// ==========================================
// LOAD PAGE
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    loadDonors
);

</script>


</body>

</html>
