<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Matching Blood Requests</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        color: #333;
    }

    header {
        background: linear-gradient(135deg, #b71c1c, #e53935);
        color: white;
        padding: 30px 50px;
    }

    header h1 {
        margin: 0;
        font-size: 32px;
    }

    header p {
        margin: 8px 0 0;
        font-size: 17px;
    }

    .container {
        width: 92%;
        max-width: 1400px;
        margin: 30px auto;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 25px;
    }

    button {
        border: none;
        padding: 13px 20px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
    }

    .back-btn {
        background: #333;
    }

    .search-btn {
        background: #7c3aed;
    }

    .search-btn:hover {
        background: #6d28d9;
    }

    /* SEARCH BOX */

    .search-box {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .search-box h2 {
        margin-top: 0;
        color: #b71c1c;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        font-weight: bold;
        margin-bottom: 7px;
    }

    .form-group select {
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
    }

    .form-group select:focus {
        outline: none;
        border-color: #b71c1c;
    }

    .search-action {
        margin-top: 20px;
    }

    /* RESULTS */

    .results-title {
        margin-bottom: 20px;
    }

    .requests {
        display: grid;
        grid-template-columns:
            repeat(auto-fit, minmax(350px, 1fr));

        gap: 25px;
    }

    .request-card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        border-left: 6px solid #16a34a;
    }

    .request-id {
        color: #777;
        font-size: 14px;
    }

    .request-card h2 {
        color: #b71c1c;
        margin: 10px 0;
    }

    .blood-group {
        display: inline-block;
        background: #fee2e2;
        color: #b91c1c;
        padding: 8px 15px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 15px;
    }

    .status {
        display: inline-block;
        background: #dcfce7;
        color: #166534;
        padding: 7px 13px;
        border-radius: 20px;
        font-weight: bold;
    }

    .compatible {
        display: inline-block;
        background: #dcfce7;
        color: #166534;
        padding: 8px 14px;
        border-radius: 20px;
        font-weight: bold;
        margin-top: 10px;
    }

    .details p {
        margin: 10px 0;
        font-size: 16px;
    }

    .empty {
        background: white;
        padding: 60px 20px;
        text-align: center;
        border-radius: 15px;
        color: #777;
        grid-column: 1 / -1;
    }

    .error {
        color: #b91c1c;
    }

    @media(max-width:700px) {

        header {
            padding: 25px;
        }

        .container {
            width: 94%;
        }

        .top-bar {
            flex-direction: column;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .requests {
            grid-template-columns: 1fr;
        }

    }
    .pdf-btn {
    background: #b71c1c;
    padding: 13px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    border: none;
    cursor: pointer;
}

.pdf-btn:hover {
    background: #8f1515;
}

</style>
</head>

<body>

<header>

```
<h1>🔎 Find Matching Blood Requests</h1>

<p>
    Find approved blood requests compatible with a donor
</p>

</header>

<div class="container">
<div class="top-bar">

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back

    </button>

</div>


<!-- SEARCH -->

<div class="search-box">

    <h2>
        🩸 Search Matching Requests
    </h2>

    <p>
        Select the donor blood group and city.
    </p>


    <div class="form-grid">


        <div class="form-group">

            <label>
                Donor Blood Group
            </label>

            <select id="donorBloodGroup">

                <option value="">
                    Select Blood Group
                </option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>

                <option value="B+">B+</option>
                <option value="B-">B-</option>

                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>

                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>

        </div>


        <div class="form-group">

            <label>
                City
            </label>

            <select id="city">

                <option value="">
                    All Cities
                </option>

                <option>Thiruvananthapuram</option>
                <option>Kollam</option>
                <option>Pathanamthitta</option>
                <option>Alappuzha</option>
                <option>Kottayam</option>
                <option>Idukki</option>
                <option>Ernakulam</option>
                <option>Thrissur</option>
                <option>Palakkad</option>
                <option>Malappuram</option>
                <option>Kozhikode</option>
                <option>Wayanad</option>
                <option>Kannur</option>
                <option>Kasaragod</option>

            </select>

        </div>

    </div>


    <div class="search-action">

        <button
            class="search-btn"
            onclick="findMatchingRequests()">

            🔎 Find Matching Requests

        </button>

    </div>

</div>


<!-- RESULTS -->

<h2 class="results-title">
    Matching Requests
</h2>

<div id="pdfSection" style="display:none; margin-bottom:20px;">

    <button
        class="pdf-btn"
        onclick="generateMatchingPDF()">

        📄 Generate Matching PDF

    </button>

</div>
<div
    id="requestsContainer"
    class="requests">

    <div class="empty">

        <h2>
            🔎 Search for Matching Requests
        </h2>

        <p>
            Select a donor blood group and click
            "Find Matching Requests".
        </p>

    </div>

</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

const API_URL =
    "http://localhost:5000/api/blood-requests";

let currentMatchingRequests = [];
let currentDonorBloodGroup = "";
let currentSelectedCity = "";


// =====================================================
// BACK BUTTON
// =====================================================

function goBack() {

    window.location.href = "admin.html";

}


// =====================================================
// BLOOD COMPATIBILITY
// =====================================================

const compatibility = {

    "A+": [
        "A+",
        "AB+"
    ],

    "A-": [
        "A-",
        "A+",
        "AB-",
        "AB+"
    ],

    "B+": [
        "B+",
        "AB+"
    ],

    "B-": [
        "B-",
        "B+",
        "AB-",
        "AB+"
    ],

    "AB+": [
        "AB+"
    ],

    "AB-": [
        "AB-",
        "AB+"
    ],

    "O+": [
        "O+",
        "A+",
        "B+",
        "AB+"
    ],

    "O-": [
        "O-",
        "O+",
        "A-",
        "A+",
        "B-",
        "B+",
        "AB-",
        "AB+"
    ]

};


// =====================================================
// FIND MATCHING REQUESTS
// =====================================================

async function findMatchingRequests() {

    const donorBloodGroup =
        document.getElementById(
            "donorBloodGroup"
        ).value;

    const selectedCity =
        document.getElementById(
            "city"
        ).value;

    const container =
        document.getElementById(
            "requestsContainer"
        );

    const pdfSection =
        document.getElementById(
            "pdfSection"
        );


    // Check blood group

    if (!donorBloodGroup) {

        pdfSection.style.display = "none";

        container.innerHTML = `

            <div class="empty error">

                <h2>
                    ⚠️ Select Blood Group
                </h2>

                <p>
                    Please select the donor blood group.
                </p>

            </div>

        `;

        return;

    }


    // Show loading

    container.innerHTML = `

        <div class="empty">

            🔄 Searching for matching requests...

        </div>

    `;


    try {

        // Get approved requests

        const response =
            await fetch(
                `${API_URL}/approved`
            );


        if (!response.ok) {

            throw new Error(
                `Server error: ${response.status}`
            );

        }


        const requests =
            await response.json();


        // Compatible blood groups

        const compatibleGroups =
            compatibility[
                donorBloodGroup
            ];


        // Filter matching requests

        const matchingRequests =
            requests.filter(request => {

                const bloodMatch =
                    compatibleGroups.includes(
                        request.bloodGroup
                    );


                const cityMatch =
                    !selectedCity ||
                    request.city === selectedCity;


                return (
                    bloodMatch &&
                    cityMatch
                );

            });


        // Save current search

        currentMatchingRequests =
            matchingRequests;

        currentDonorBloodGroup =
            donorBloodGroup;

        currentSelectedCity =
            selectedCity;


        // Display results

        displayMatchingRequests(
            matchingRequests,
            donorBloodGroup
        );


    } catch (error) {

        console.error(
            "Matching request error:",
            error
        );


        pdfSection.style.display =
            "none";


        container.innerHTML = `

            <div class="empty error">

                <h2>
                    ❌ Failed to find matching requests
                </h2>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

                <p>
                    Make sure Spring Boot is running
                    on localhost:5000.
                </p>

            </div>

        `;

    }

}


// =====================================================
// DISPLAY MATCHING REQUESTS
// =====================================================

function displayMatchingRequests(
    requests,
    donorBloodGroup
) {

    const container =
        document.getElementById(
            "requestsContainer"
        );

    const pdfSection =
        document.getElementById(
            "pdfSection"
        );


    // No results

    if (
        !requests ||
        requests.length === 0
    ) {

        pdfSection.style.display =
            "none";


        container.innerHTML = `

            <div class="empty">

                <h2>
                    🩸 No Matching Requests
                </h2>

                <p>

                    No approved blood requests
                    were found for donor blood group

                    <strong>
                        ${escapeHtml(
                            donorBloodGroup
                        )}
                    </strong>

                    in the selected city.

                </p>

            </div>

        `;

        return;

    }


    // Show PDF button

    pdfSection.style.display =
        "block";


    // Clear old results

    container.innerHTML = "";


    // Create cards

    requests.forEach(request => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "request-card";


        card.innerHTML = `

            <div class="request-id">

                Request ID:
                #${request.id}

            </div>


            <h2>

                🏥
                ${escapeHtml(
                    request.hospitalName ||
                    "Hospital"
                )}

            </h2>


            <div class="blood-group">

                🩸
                ${escapeHtml(
                    request.bloodGroup ||
                    "N/A"
                )}

            </div>


            <div class="details">

                <p>

                    <strong>
                        Patient:
                    </strong>

                    ${escapeHtml(
                        request.patientName ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Age:
                    </strong>

                    ${request.age ??
                        "Not provided"}

                </p>


                <p>

                    <strong>
                        Gender:
                    </strong>

                    ${escapeHtml(
                        request.gender ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Patient Status:
                    </strong>

                    ${escapeHtml(
                        request.patientStatus ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Units Required:
                    </strong>

                    ${request.unitsRequired ??
                        "Not provided"}

                </p>


                <p>

                    <strong>
                        City:
                    </strong>

                    ${escapeHtml(
                        request.city ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Required Date:
                    </strong>

                    ${request.requiredDate ||
                        "Not provided"}

                </p>


                <p>

                    <strong>
                        Phone:
                    </strong>

                    ${escapeHtml(
                        request.phone ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Reason:
                    </strong>

                    ${escapeHtml(
                        request.reason ||
                        "Not provided"
                    )}

                </p>


                <p>

                    <strong>
                        Status:
                    </strong>

                    <span class="status">

                        ${escapeHtml(
                            request.status ||
                            "Approved"
                        )}

                    </span>

                </p>


                <div class="compatible">

                    ✅ Compatible with
                    ${escapeHtml(
                        donorBloodGroup
                    )}

                </div>

            </div>

        `;


        container.appendChild(card);

    });

}


// =====================================================
// GENERATE PROFESSIONAL PDF
// =====================================================

function generateMatchingPDF() {

    if (
        !currentMatchingRequests ||
        currentMatchingRequests.length === 0
    ) {

        alert(
            "No matching requests available to generate PDF."
        );

        return;

    }


    // Check jsPDF

    if (
        !window.jspdf ||
        !window.jspdf.jsPDF
    ) {

        alert(
            "PDF library could not be loaded. Please check your internet connection."
        );

        return;

    }


    const {
        jsPDF
    } = window.jspdf;


    const doc =
        new jsPDF();


    const pageWidth =
        doc.internal.pageSize.getWidth();

    const pageHeight =
        doc.internal.pageSize.getHeight();


    const margin = 18;

    let y = 20;


    // =====================================================
    // HEADER
    // =====================================================

    doc.setFillColor(
        183,
        28,
        28
    );


    doc.rect(
        0,
        0,
        pageWidth,
        35,
        "F"
    );


    doc.setTextColor(
        255,
        255,
        255
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(20);


    doc.text(
        "BLOOD DONATION",
        margin,
        15
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.setFontSize(13);


    doc.text(
        "Matching Request Report",
        margin,
        25
    );


    // =====================================================
    // REPORT INFORMATION
    // =====================================================

    y = 48;


    doc.setTextColor(
        50,
        50,
        50
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.setFontSize(10);


    doc.text(
        `Generated: ${new Date().toLocaleString()}`,
        margin,
        y
    );


    y += 7;


    doc.text(
        `Donor Blood Group: ${currentDonorBloodGroup}`,
        margin,
        y
    );


    y += 7;


    doc.text(
        `Search City: ${
            currentSelectedCity ||
            "All Cities"
        }`,
        margin,
        y
    );


    y += 7;


    doc.text(
        `Total Matching Requests: ${
            currentMatchingRequests.length
        }`,
        margin,
        y
    );


    // =====================================================
    // COMPATIBILITY SUMMARY
    // =====================================================

    y += 13;


    doc.setFillColor(
        220,
        252,
        231
    );


    doc.roundedRect(
        margin,
        y,
        pageWidth - margin * 2,
        25,
        3,
        3,
        "F"
    );


    doc.setTextColor(
        22,
        101,
        52
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(11);


    doc.text(
        "✓ COMPATIBILITY MATCH FOUND",
        margin + 6,
        y + 9
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.setFontSize(9);


    doc.text(
        `${currentDonorBloodGroup} donor is compatible with`,
        margin + 6,
        y + 16
    );


    doc.text(
        "the blood groups required by the requests below.",
        margin + 6,
        y + 21
    );


    y += 35;


    // =====================================================
    // MATCHING REQUESTS
    // =====================================================

    currentMatchingRequests.forEach(
        (request, index) => {


            // New page when required

            if (
                y >
                pageHeight - 85
            ) {

                doc.addPage();

                y = 20;

            }


            // Request header

            doc.setFillColor(
                183,
                28,
                28
            );


            doc.roundedRect(
                margin,
                y,
                pageWidth - margin * 2,
                10,
                2,
                2,
                "F"
            );


            doc.setTextColor(
                255,
                255,
                255
            );


            doc.setFont(
                "helvetica",
                "bold"
            );


            doc.setFontSize(11);


            doc.text(
                `MATCHING REQUEST #${
                    index + 1
                }`,
                margin + 5,
                y + 7
            );


            y += 17;


            // Helper function

            function addRow(
                label,
                value
            ) {

                doc.setTextColor(
                    50,
                    50,
                    50
                );


                doc.setFont(
                    "helvetica",
                    "bold"
                );


                doc.setFontSize(9);


                doc.text(
                    label,
                    margin,
                    y
                );


                doc.setFont(
                    "helvetica",
                    "normal"
                );


                const text =
                    String(
                        value ??
                        "Not provided"
                    );


                const wrapped =
                    doc.splitTextToSize(
                        text,
                        pageWidth -
                        margin * 2 -
                        45
                    );


                doc.text(
                    wrapped,
                    margin + 40,
                    y
                );


                y +=
                    Math.max(
                        6,
                        wrapped.length * 5
                    );

            }


            // Request details

            addRow(
                "Request ID:",
                `#${request.id}`
            );


            addRow(
                "Hospital:",
                request.hospitalName
            );


            addRow(
                "Patient:",
                request.patientName
            );


            addRow(
                "Age:",
                request.age
            );


            addRow(
                "Gender:",
                request.gender
            );


            addRow(
                "Blood Group:",
                request.bloodGroup
            );


            addRow(
                "Units Required:",
                request.unitsRequired
            );


            addRow(
                "City:",
                request.city
            );


            addRow(
                "Required Date:",
                request.requiredDate
            );


            addRow(
                "Patient Status:",
                request.patientStatus
            );


            addRow(
                "Contact:",
                request.phone
            );


            addRow(
                "Reason:",
                request.reason
            );


            // Status

            doc.setFont(
                "helvetica",
                "bold"
            );


            doc.text(
                "Status:",
                margin,
                y
            );


            doc.setTextColor(
                22,
                101,
                52
            );


            doc.text(
                request.status ||
                "Approved",
                margin + 40,
                y
            );


            y += 8;


            // Compatibility box

            doc.setFillColor(
                220,
                252,
                231
            );


            doc.roundedRect(
                margin,
                y,
                pageWidth - margin * 2,
                12,
                2,
                2,
                "F"
            );


            doc.setTextColor(
                22,
                101,
                52
            );


            doc.setFont(
                "helvetica",
                "bold"
            );


            doc.setFontSize(9);


            doc.text(
                `✓ Compatible: ${
                    currentDonorBloodGroup
                } → ${
                    request.bloodGroup
                }`,
                margin + 5,
                y + 8
            );


            y += 20;


            // Separator

            doc.setDrawColor(
                210,
                210,
                210
            );


            doc.line(
                margin,
                y,
                pageWidth - margin,
                y
            );


            y += 12;

        }
    );


    // =====================================================
    // FOOTER ON EVERY PAGE
    // =====================================================

    const totalPages =
        doc.internal.getNumberOfPages();


    for (
        let page = 1;
        page <= totalPages;
        page++
    ) {

        doc.setPage(page);


        doc.setTextColor(
            120,
            120,
            120
        );


        doc.setFont(
            "helvetica",
            "normal"
        );


        doc.setFontSize(8);


        doc.text(
            "Blood Donation Management System",
            margin,
            pageHeight - 10
        );


        doc.text(
            `Page ${page} of ${totalPages}`,
            pageWidth - 45,
            pageHeight - 10
        );

    }


    // =====================================================
    // SAVE PDF
    // =====================================================

    const today =
        new Date()
            .toISOString()
            .slice(0, 10);


    const filename =
        `Blood_Matching_Report_${
            currentDonorBloodGroup
        }_${today}.pdf`;


    doc.save(filename);

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}

</script>

</body>

</html>
