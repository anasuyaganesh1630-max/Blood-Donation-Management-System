<script>

const API_URL =
    "http://localhost:5000/api/blood-requests";


// =========================================================
// BACK TO ADMIN
// =========================================================

function goBack() {

    window.location.href = "admin.html";

}


// =========================================================
// SAFE JSON RESPONSE
// =========================================================

async function getResponseData(response) {

    const text =
        await response.text();

    if (!text) {
        return {};
    }

    try {

        return JSON.parse(text);

    } catch {

        return {
            message: text
        };

    }

}


// =========================================================
// LOAD APPROVED REQUESTS
// =========================================================

async function loadApprovedRequests() {

    const container =
        document.getElementById(
            "requestsContainer"
        );

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );

    container.innerHTML = `
        <div class="empty">
            Loading approved blood requests...
        </div>
    `;

    refreshButton.disabled = true;

    try {

        const response =
            await fetch(
                `${API_URL}/approved`,
                {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

        const data =
            await getResponseData(response);

        console.log(
            "Approved requests response:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.message ||
                `Server returned HTTP ${response.status}`
            );

        }

        if (!Array.isArray(data)) {

            throw new Error(
                "Backend did not return a request list."
            );

        }

        displayRequests(data);

    } catch (error) {

        console.error(
            "LOAD APPROVED REQUESTS ERROR:",
            error
        );

        container.innerHTML = `

            <div class="empty error">

                <h2>
                    ❌ Failed to load requests
                </h2>

                <p>
                    ${escapeHtml(
                        getErrorMessage(error)
                    )}
                </p>

                <p>
                    Make sure Spring Boot is running
                    on port 5000.
                </p>

                <button
                    type="button"
                    class="refresh"
                    onclick="loadApprovedRequests()">

                    🔄 Try Again

                </button>

            </div>

        `;

    } finally {

        refreshButton.disabled = false;

    }

}


// =========================================================
// DISPLAY REQUESTS
// =========================================================

function displayRequests(requests) {

    const container =
        document.getElementById(
            "requestsContainer"
        );

    if (!requests || requests.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    🏥 No Approved Requests
                </h2>

                <p>
                    No blood requests have been approved yet.
                </p>

            </div>

        `;

        return;
    }

    container.innerHTML = "";

    requests.forEach(request => {

        const card =
            document.createElement("div");

        card.className =
            "request-card";

        card.innerHTML = `

            <div class="request-id">
                Request ID: #${escapeHtml(
                    request.id ?? "N/A"
                )}
            </div>

            <h2>
                🏥 ${escapeHtml(
                    request.hospitalName ||
                    "Not provided"
                )}
            </h2>

            <div class="blood-group">
                🩸 ${escapeHtml(
                    request.bloodGroup ||
                    "Not provided"
                )}
            </div>

            <div class="details">

                <p>
                    <strong>Patient:</strong>
                    ${escapeHtml(
                        request.patientName ||
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>Age:</strong>
                    ${escapeHtml(
                        request.age ??
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>Gender:</strong>
                    ${escapeHtml(
                        request.gender ||
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>Patient Status:</strong>
                    ${escapeHtml(
                        request.patientStatus ||
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>Blood Units:</strong>
                    ${escapeHtml(
                        request.unitsRequired ??
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>City:</strong>
                    ${escapeHtml(
                        request.city ||
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${escapeHtml(
                        request.phone ||
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>Reason:</strong>
                    ${escapeHtml(
                        request.reason ||
                        "Not provided"
                    )}
                </p>

                <p>
                    <strong>Status:</strong>

                    <span class="status">
                        ${escapeHtml(
                            request.status ||
                            "Approved"
                        )}
                    </span>

                </p>

            </div>

            <div class="action-buttons">

                <button
                    type="button"
                    class="edit-btn"
                    data-action="edit">

                    ✏️ Edit

                </button>

                <button
                    type="button"
                    class="delete-btn"
                    data-action="delete">

                    🗑️ Delete

                </button>

            </div>

        `;

        const editButton =
            card.querySelector(
                '[data-action="edit"]'
            );

        const deleteButton =
            card.querySelector(
                '[data-action="delete"]'
            );

        editButton.addEventListener(
            "click",
            () => openEditModal(request)
        );

        deleteButton.addEventListener(
            "click",
            () => deleteRequest(request.id)
        );

        container.appendChild(card);

    });

}


// =========================================================
// OPEN EDIT MODAL
// =========================================================

function openEditModal(request) {

    document.getElementById(
        "editId"
    ).value =
        request.id ?? "";

    document.getElementById(
        "editHospitalId"
    ).value =
        request.hospitalId ?? "";

    document.getElementById(
        "editRequestDate"
    ).value =
        request.requestDate ?? "";

    document.getElementById(
        "editRequiredDate"
    ).value =
        request.requiredDate ?? "";

    document.getElementById(
        "editStatus"
    ).value =
        request.status || "Approved";

    document.getElementById(
        "editHospitalName"
    ).value =
        request.hospitalName ?? "";

    document.getElementById(
        "editPatientName"
    ).value =
        request.patientName ?? "";

    document.getElementById(
        "editAge"
    ).value =
        request.age ?? "";

    document.getElementById(
        "editGender"
    ).value =
        request.gender ?? "";

    document.getElementById(
        "editPatientStatus"
    ).value =
        request.patientStatus ?? "";

    document.getElementById(
        "editBloodGroup"
    ).value =
        request.bloodGroup ?? "";

    document.getElementById(
        "editUnitsRequired"
    ).value =
        request.unitsRequired ?? "";

    document.getElementById(
        "editCity"
    ).value =
        request.city ?? "";

    document.getElementById(
        "editPhone"
    ).value =
        request.phone ?? "";

    document.getElementById(
        "editReason"
    ).value =
        request.reason ?? "";

    document.getElementById(
        "editMessage"
    ).textContent = "";

    document.getElementById(
        "editModal"
    ).style.display = "block";

}


// =========================================================
// CLOSE EDIT MODAL
// =========================================================

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).style.display = "none";

}


// =========================================================
// SAVE EDIT
// =========================================================

document.getElementById(
    "editForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const id =
            document.getElementById(
                "editId"
            ).value;

        const message =
            document.getElementById(
                "editMessage"
            );

        const saveButton =
            document.getElementById(
                "saveButton"
            );

        if (!id) {

            message.style.color =
                "#dc2626";

            message.textContent =
                "❌ Request ID is missing.";

            return;

        }

        const requestData = {

            hospitalId:
                getNumberOrNull(
                    document.getElementById(
                        "editHospitalId"
                    ).value
                ),

            hospitalName:
                document.getElementById(
                    "editHospitalName"
                ).value.trim(),

            patientName:
                document.getElementById(
                    "editPatientName"
                ).value.trim(),

            age:
                getNumberOrNull(
                    document.getElementById(
                        "editAge"
                    ).value
                ),

            gender:
                document.getElementById(
                    "editGender"
                ).value,

            patientStatus:
                document.getElementById(
                    "editPatientStatus"
                ).value,

            bloodGroup:
                document.getElementById(
                    "editBloodGroup"
                ).value,

            unitsRequired:
                getNumberOrNull(
                    document.getElementById(
                        "editUnitsRequired"
                    ).value
                ),

            city:
                document.getElementById(
                    "editCity"
                ).value,

            phone:
                document.getElementById(
                    "editPhone"
                ).value.trim(),

            reason:
                document.getElementById(
                    "editReason"
                ).value.trim(),

            requestDate:
                document.getElementById(
                    "editRequestDate"
                ).value || null,

            requiredDate:
                document.getElementById(
                    "editRequiredDate"
                ).value || null,

            status:
                document.getElementById(
                    "editStatus"
                ).value || "Approved"

        };

        console.log(
            "Updating request:",
            id,
            requestData
        );

        message.style.color =
            "#333";

        message.textContent =
            "Saving changes...";

        saveButton.disabled = true;

        try {

            const response =
                await fetch(
                    `${API_URL}/${encodeURIComponent(id)}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                requestData
                            )
                    }
                );

            const result =
                await getResponseData(
                    response
                );

            console.log(
                "Update response:",
                result
            );

            if (!response.ok) {

                throw new Error(
                    result.message ||
                    `Update failed. HTTP ${response.status}`
                );

            }

            alert(
                "✅ Blood request updated successfully!"
            );

            closeEditModal();

            await loadApprovedRequests();

        } catch (error) {

            console.error(
                "UPDATE REQUEST ERROR:",
                error
            );

            message.style.color =
                "#dc2626";

            message.textContent =
                "❌ " +
                getErrorMessage(error);

        } finally {

            saveButton.disabled = false;

        }

    }
);


// =========================================================
// DELETE REQUEST
// =========================================================

async function deleteRequest(id) {

    if (!id) {

        alert(
            "❌ Request ID is missing."
        );

        return;

    }

    const confirmed =
        confirm(
            "⚠️ Are you sure you want to delete this blood request?\n\n" +
            "This action cannot be undone."
        );

    if (!confirmed) {
        return;
    }

    try {

        console.log(
            "Deleting blood request:",
            id
        );

        const response =
            await fetch(
                `${API_URL}/${encodeURIComponent(id)}`,
                {
                    method: "DELETE",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );

        const result =
            await getResponseData(
                response
            );

        console.log(
            "Delete response:",
            result
        );

        if (!response.ok) {

            throw new Error(
                result.message ||
                `Delete failed. HTTP ${response.status}`
            );

        }

        alert(
            "🗑️ Blood request deleted successfully!"
        );

        await loadApprovedRequests();

    } catch (error) {

        console.error(
            "DELETE REQUEST ERROR:",
            error
        );

        alert(
            "❌ " +
            getErrorMessage(error)
        );

    }

}


// =========================================================
// NUMBER HELPER
// =========================================================

function getNumberOrNull(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    const number =
        Number(value);

    return Number.isNaN(number)
        ? null
        : number;

}


// =========================================================
// ERROR MESSAGE
// =========================================================

function getErrorMessage(error) {

    if (
        error &&
        error.message === "Failed to fetch"
    ) {

        return (
            "Cannot connect to the backend. " +
            "Make sure Spring Boot is running on " +
            "http://localhost:5000 and that CORS is configured."
        );

    }

    return error &&
        error.message
        ? error.message
        : "Unknown error occurred.";

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// =========================================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// =========================================================

window.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "editModal"
            );

        if (
            event.target === modal
        ) {

            closeEditModal();

        }

    }
);


// =========================================================
// ESCAPE KEY CLOSES MODAL
// =========================================================

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeEditModal();

        }

    }
);


// =========================================================
// LOAD PAGE
// =========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadApprovedRequests();
