</div>

<script>

const API_URL =
    "http://localhost:5000/api/registrations";


// ==========================================
// BACK TO ADMIN
// ==========================================

function goBack() {

    window.location.href = "admin.html";

}


// ==========================================
// LOAD PENDING REGISTRATIONS
// ==========================================

async function loadRegistrations() {

    const container =
        document.getElementById(
            "registrationsContainer"
        );

    container.innerHTML = `
        <div class="empty">
            Loading registrations...
        </div>
    `;

    try {

        const response =
            await fetch(
                `${API_URL}/pending`
            );

        const text =
            await response.text();

        console.log(
            "Pending registrations:",
            text
        );

        if (!response.ok) {

            throw new Error(
                `Server error: ${response.status}`
            );

        }

        let registrations;

        try {

            registrations =
                JSON.parse(text);

        } catch {

            throw new Error(
                "Backend returned invalid JSON"
            );

        }

        displayRegistrations(
            registrations
        );

    } catch (error) {

        console.error(
            "Registration loading error:",
            error
        );

        container.innerHTML = `

            <div class="empty error">

                <h2>
                    ❌ Failed to load registrations
                </h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

                <p>
                    Make sure Java is running
                    on port 5000.
                </p>

            </div>

        `;

    }

}


// ==========================================
// DISPLAY REGISTRATIONS
// ==========================================

function displayRegistrations(registrations) {

    const container =
        document.getElementById(
            "registrationsContainer"
        );


    if (!registrations ||
        registrations.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    ✅ No Pending Registrations
                </h2>

                <p>
                    There are currently no donor
                    or hospital registrations
                    waiting for approval.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    registrations.forEach(user => {

        const card =
            document.createElement("div");

        card.className = "card";


        const role =
            user.role || "Unknown";


        card.innerHTML = `

            <h2>
                ${role.toLowerCase() === "donor"
                    ? "🩸"
                    : "🏥"}
                ${escapeHtml(
                    user.name || "No name"
                )}
            </h2>


            <span class="role">
                ${escapeHtml(role)}
            </span>


            <p>
                <strong>ID:</strong>
                ${user.id ?? "N/A"}
            </p>


            <p>
                <strong>Email:</strong>
                ${escapeHtml(
                    user.email || "N/A"
                )}
            </p>


            <p>
                <strong>Registration Date:</strong>
                ${escapeHtml(
                    user.createdAt || "N/A"
                )}
            </p>


            <p>
                <strong>Status:</strong>

                <span class="status">
                    ${escapeHtml(
                        user.status || "Pending"
                    )}
                </span>

            </p>


            <div class="buttons">

                <button
                    class="approve"
                    onclick="approveRegistration(${user.id})">

                    ✓ Approve

                </button>


                <button
                    class="reject"
                    onclick="rejectRegistration(${user.id})">

                    ✕ Reject

                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


// ==========================================
// APPROVE
// ==========================================

async function approveRegistration(id) {

    if (!confirm(
        "Approve this registration?"
    )) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/approve/${id}`,
                {
                    method: "PUT"
                }
            );


        const text =
            await response.text();


        console.log(
            "Approve response:",
            text
        );


        let result = {};

        try {
            result = JSON.parse(text);
        } catch {
            result = {};
        }


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Approval failed: ${response.status}`
            );

        }


        alert(
            "✅ Registration approved successfully!"
        );


        loadRegistrations();

    } catch (error) {

        console.error(
            "Approval error:",
            error
        );

        alert(
            "❌ " + error.message
        );

    }

}


// ==========================================
// REJECT
// ==========================================

async function rejectRegistration(id) {

    if (!confirm(
        "Reject this registration?"
    )) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/reject/${id}`,
                {
                    method: "PUT"
                }
            );


        const text =
            await response.text();


        console.log(
            "Reject response:",
            text
        );


        let result = {};

        try {
            result = JSON.parse(text);
        } catch {
            result = {};
        }


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Rejection failed: ${response.status}`
            );

        }


        alert(
            "❌ Registration rejected."
        );


        loadRegistrations();

    } catch (error) {

        console.error(
            "Reject error:",
            error
        );

        alert(
            "❌ " + error.message
        );

    }

}


// ==========================================
// HTML SECURITY
// ==========================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// ==========================================
// LOAD PAGE
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    loadRegistrations
);

</script>
