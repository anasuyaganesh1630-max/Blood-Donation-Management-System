<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hospital Blood Request</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f2;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #d71920;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            margin-bottom: 30px;
            color: #444;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #e11d48;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / 3;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #e11d2e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #b91c1c;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        @media(max-width:700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>🏥 Hospital Blood Request</h1>

    <p class="description">
        Enter the patient's details and submit a blood request.
        The request will be reviewed by the administrator.
    </p>


    <form id="bloodRequestForm">

        <div class="form-grid">
<div>
    <input
        type="text"
        id="hospital_name"
        placeholder="Hospital Name"
        required>
</div>

            <!-- Patient Name -->

            <div>
                <input
                    type="text"
                    id="patient_name"
                    placeholder="Patient Name"
                    required>
            </div>


            <!-- Age -->

            <div>
                <input
                    type="number"
                    id="age"
                    placeholder="Patient Age"
                    min="1"
                    max="120"
                    required>
            </div>


            <!-- Gender -->

            <div>

                <select id="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>
<div>
    <select id="patient_status" required>

        <option value="">
            Select Patient Status
        </option>

        <option value="Stable">
            🟢 Stable
        </option>

        <option value="Critical">
            🟡 Critical
        </option>

        <option value="Emergency">
            🔴 Emergency
        </option>

    </select>
</div>

            <!-- Blood Group -->

            <div>

                <select id="blood_group" required>

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

            </div>


            <!-- Units -->

            <div>

                <input
                    type="number"
                    id="units"
                    placeholder="Required Blood Units"
                    min="1"
                    required>

            </div>


            <!-- City -->

         <select id="city" required>
    <option value="">Select Place</option>

    <option value="Thiruvananthapuram">
        Thiruvananthapuram
    </option>

    <option value="Kollam">
        Kollam
    </option>

    <option value="Pathanamthitta">
        Pathanamthitta
    </option>

    <option value="Alappuzha">
        Alappuzha
    </option>

    <option value="Kottayam">
        Kottayam
    </option>

    <option value="Idukki">
        Idukki
    </option>

    <option value="Ernakulam">
        Ernakulam
    </option>

    <option value="Thrissur">
        Thrissur
    </option>

    <option value="Palakkad">
        Palakkad
    </option>

    <option value="Malappuram">
        Malappuram
    </option>

    <option value="Kozhikode">
        Kozhikode
    </option>

    <option value="Wayanad">
        Wayanad
    </option>

    <option value="Kannur">
        Kannur
    </option>

    <option value="Kasaragod">
        Kasaragod
    </option>
</select>


            <!-- Phone -->

            <div>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Hospital Contact Phone"
                    required>

            </div>


            <!-- Reason -->

            <div class="full">

                <textarea
                    id="reason"
                    placeholder="Reason for Blood Requirement"
                    required></textarea>

            </div>


            <!-- Submit -->

            <div class="full">

                <button type="submit">
                    🚨 Submit Blood Request
                </button>

            </div>

        </div>

    </form>


    <div id="message"></div>

</div>


<script>
document.getElementById("bloodRequestForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const requestData = {
        hospital_name: document.getElementById("hospital_name").value.trim(),
        patient_name: document.getElementById("patient_name").value.trim(),
        age: document.getElementById("age").value,
        gender: document.getElementById("gender").value,
        patient_status: document.getElementById("patient_status").value,
        blood_group: document.getElementById("blood_group").value,
        units: document.getElementById("units").value,
        city: document.getElementById("city").value,
        phone: document.getElementById("phone").value.trim(),
        reason: document.getElementById("reason").value.trim()
    };

    const message = document.getElementById("message");

    try {

        const response = await fetch(
            "http://localhost:5000/api/requests/add",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestData)
            }
        );

        // Get response as text first
        const text = await response.text();

        let result;

        try {
            result = JSON.parse(text);
        } catch (jsonError) {
            console.error("Invalid server response:", text);

            throw new Error(
                "Server returned an invalid response. Check backend."
            );
        }

        if (!response.ok) {
            throw new Error(
                result.message || "Failed to submit blood request"
            );
        }

        message.style.color = "green";
        message.textContent =
            "🩸 Blood request submitted successfully!";

        alert("🩸 Blood request submitted successfully!");

        document.getElementById("bloodRequestForm").reset();

    } catch (error) {

        console.error("Blood Request Error:", error);

        message.style.color = "red";
        message.textContent = "❌ " + error.message;

    }

});
</script>
<script src="hospital.js"></script>
</body>
</html>
