<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Blood Requests</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: linear-gradient(
                135deg,
                #b71c1c,
                #e53935
            );

            color: white;
            padding: 30px 50px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
        }

        .back-btn,
        .refresh-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .back-btn {
            background: #333;
        }

        .refresh-btn {
            background: #d32f2f;
        }

        .requests {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 20px;
        }

        .request-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            border-left: 6px solid #d32f2f;
        }

        .request-card h2 {
            margin-top: 0;
            color: #b71c1c;
        }

        .blood {
            display: inline-block;

            background: #ffe5e5;
            color: #b71c1c;

            font-size: 20px;
            font-weight: bold;

            padding: 8px 15px;
            border-radius: 20px;

            margin-bottom: 15px;
        }

        .request-card p {
            margin: 10px 0;
        }

        .status {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 15px;

            background: #fff3cd;
            color: #856404;

            font-weight: bold;
        }

        /* BUTTON CONTAINER */

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* APPROVE */

        .approve {
            flex: 1;

            background: #16a34a;
            color: white;

            border: none;

            padding: 12px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
            font-size: 15px;
        }

        .approve:hover {
            background: #15803d;
        }

        /* REJECT */

        .reject {
            flex: 1;

            background: #dc2626;
            color: white;

            border: none;

            padding: 12px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
            font-size: 15px;
        }

        .reject:hover {
            background: #b91c1c;
        }

        /* DISABLED */

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty {
            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 15px;

            color: #777;
        }

        .error {
            color: #b71c1c;
            font-weight: bold;
        }

        @media(max-width:600px) {

            header {
                padding: 25px;
            }

            header h1 {
                font-size: 25px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .action-buttons {
                flex-direction: column;
            }

        }
        .buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

.approve,
.reject {
    flex: 1;
    border: none;
    padding: 12px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.approve {
    background: #16a34a;
}

.approve:hover {
    background: #15803d;
}

.reject {
    background: #dc2626;
}

.reject:hover {
    background: #b91c1c;
}

    </style>

</head>


<body>


<header>

    <h1>🏥 Patient Blood Requests</h1>

    <p>
        View and manage blood requests submitted by hospitals
    </p>

</header>


<div class="container">


    <div class="top-bar">

        <button
            class="back-btn"
            onclick="goBack()">

            ← Back to Admin

        </button>


        <button
            class="refresh-btn"
            onclick="loadRequests()">

            🔄 Refresh

        </button>

    </div>


    <div id="requestsContainer">

        <div class="empty">

            Loading patient requests...

        </div>

    </div>


</div>

<script>

function goBack() {
    window.location.href = "admin.html";
}


// ==========================================
// LOAD ALL BLOOD REQUESTS
// ==========================================

async function loadRequests() {

    const container =
        document.getElementById("requestsContainer");

    container.innerHTML = `
        <div class="empty">
            Loading patient requests...
        </div>
    `;

    try {

        const response = await fetch(
            "http://localhost:5000/api/requests/pending"
        );

        const text = await response.text();

        let requests;

        try {
            requests = JSON.parse(text);
        } catch (error) {
            throw new Error("Server returned invalid JSON");
        }

        if (!response.ok) {
            throw new Error(
                requests.message ||
                "Failed to load blood requests"
            );
        }

        if (!Array.isArray(requests) || requests.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h2>🎉 No Blood Requests</h2>
                    <p>
                        There are currently no patient blood requests.
                    </p>
                </div>
            `;

            return;
        }


        // Create requests grid

        const requestsWrapper =
            document.createElement("div");

        requestsWrapper.className = "requests";


        requests.forEach(request => {

            const card =
                document.createElement("div");

            card.className = "request-card";


            card.innerHTML = `

                <h2>🧑 Patient Details</h2>

                <div class="blood">
                    🩸 ${request.blood_group || "N/A"}
                </div>

                <p>
                    <strong>Patient Name:</strong>
                    ${request.patient_name || "N/A"}
                </p>

                <p>
                    <strong>Age:</strong>
                    ${request.age || "N/A"}
                </p>

                <p>
                    <strong>Gender:</strong>
                    ${request.gender || "N/A"}
                </p>

                <p>
                    <strong>Blood Group:</strong>
                    ${request.blood_group || "N/A"}
                </p>

                <p>
                    <strong>Required Units:</strong>
                    ${request.units || "N/A"}
                </p>

                <p>
                    <strong>City:</strong>
                    ${request.city || "N/A"}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${request.phone || "N/A"}
                </p>

                <p>
                    <strong>Reason:</strong>
                    ${request.reason || "N/A"}
                </p>

                <p>
                    <strong>Status:</strong>

                    <span class="status">
                        ${request.status || "pending"}
                    </span>
                </p>

<button onclick="approveRequest(${request.request_id})">
    ✅ Approve
</button>

<button onclick="rejectRequest(${request.request_id})">
    ❌ Reject
</button>
                ${
                    request.status === "pending"
                    ? `

                    <div class="action-buttons">

                        <button onclick="approveRequest(${request.request_id})">
    ✅ Approve
</button>


                      <button onclick="rejectRequest(${request.request_id})">
    ❌ Reject
</button>

                    </div>

                    `
                    : `
                      
                    `
                }

            `;

            requestsWrapper.appendChild(card);

        });


        container.innerHTML = "";

        container.appendChild(requestsWrapper);


    } catch (error) {

        console.error(
            "LOAD REQUEST ERROR:",
            error
        );

        container.innerHTML = `

            <div class="empty">

                <h2>
                    ❌ Cannot load blood requests.
                </h2>

                <p>
                    ${error.message}
                </p>

                <p>
                    Make sure your backend is running
                    on port 5000.
                </p>

            </div>

        `;

    }

}
async function loadRegistrations() {

    const container =
        document.getElementById("requestsContainer");

    container.innerHTML = `
        <div class="empty">
            Loading registrations...
        </div>
    `;

    try {

        const response = await fetch(
            "http://localhost:5000/api/registration/pending"
        );

        const text = await response.text();

        console.log("Status:", response.status);
        console.log("Response:", text);

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}: ${text}`
            );

        }

        let registrations;

        try {

            registrations = JSON.parse(text);

        } catch (jsonError) {

            throw new Error(
                "Backend did not return JSON. Check the API URL."
            );

        }

        if (
            !registrations ||
            registrations.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">

                    <h2>
                        🎉 No Pending Registrations
                    </h2>

                    <p>
                        There are no pending
                        donor or hospital registrations.
                    </p>

                </div>
            `;

            return;
        }

        container.innerHTML = "";

        registrations.forEach(registration => {

            const card =
                document.createElement("div");

            card.className = "request-card";

            const isHospital =
                registration.role === "hospital";

            const icon =
                isHospital ? "🏥" : "🩸";

            const type =
                isHospital ? "Hospital" : "Donor";

            card.innerHTML = `

                <div class="icon">
                    ${icon}
                </div>

                <h2>
                    ${registration.name}
                </h2>

                <div class="type">
                    ${type}
                </div>

                <p>
                    <strong>Email:</strong>
                    ${registration.email}
                </p>

                <p>
                    <strong>Type:</strong>
                    ${type}
                </p>

                <p>
                    <strong>Status:</strong>

                    <span class="status">
                        ${registration.status}
                    </span>
                </p>

                <div class="buttons">

                    <button
                        class="approve"
                        onclick="
                            updateRegistration(
                                ${registration.id},
                                'approved'
                            )
                        ">

                        ✓ Approve

                    </button>

                    <button
                        class="reject"
                        onclick="
                            updateRegistration(
                                ${registration.id},
                                'rejected'
                            )
                        ">

                        ✕ Reject

                    </button>

                </div>

            `;

            container.appendChild(card);

        });

    } catch (error) {

        console.error(
            "ERROR:",
            error
        );

        container.innerHTML = `

            <div class="empty">

                <h2>
                    ❌ Unable to Load Registrations
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}
async function updateRequestStatus(requestId, status) {

    try {

        const response = await fetch(
            `http://localhost:5000/api/requests/status/${requestId}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Failed to update request"
            );
        }

        alert(data.message);

        // Reload requests
        loadRequests();

    } catch (error) {

        console.error(error);

        alert("❌ " + error.message);

    }

}
async function approveRequest(id) {

    console.log("Approving request ID:", id);

    try {

        const response = await fetch(
            `http://localhost:5000/api/requests/status/${id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: "approved"
                })
            }
        );

        console.log("Response status:", response.status);

        const text = await response.text();

        console.log("Server response:", text);

        let data;

        try {
            data = JSON.parse(text);
        } catch (e) {
            console.error("Server did not return JSON:", text);

            alert(
                "Server returned an invalid response.\n\n" +
                text.substring(0, 200)
            );

            return;
        }

        if (!response.ok) {

            alert("❌ " + (data.message || "Failed to approve request"));

            return;
        }

        alert("✅ Blood request approved successfully");

        loadRequests();

    } catch (error) {

        console.error("APPROVE ERROR:", error);

        alert(
            "❌ Failed to approve request.\n\n" +
            error.message
        );
    }
}
async function rejectRequest(id) {

    console.log("Rejecting request ID:", id);

    try {

        const response = await fetch(
            `http://localhost:5000/api/requests/status/${id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: "rejected"
                })
            }
        );

        console.log("Response status:", response.status);

        const text = await response.text();

        console.log("Server response:", text);

        let data;

        try {
            data = JSON.parse(text);
        } catch (e) {

            console.error("Server did not return JSON:", text);

            alert(
                "Server returned an invalid response.\n\n" +
                text.substring(0, 200)
            );

            return;
        }

        if (!response.ok) {

            alert("❌ " + (data.message || "Failed to reject request"));

            return;
        }

        alert("✅ Blood request rejected successfully");

        loadRequests();

    } catch (error) {

        console.error("REJECT ERROR:", error);

        alert(
            "❌ Failed to reject request.\n\n" +
            error.message
        );
    }
}
loadRequests();

</script>


</body>

</html>
