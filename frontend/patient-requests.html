<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Blood Requests</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #b71c1c, #e53935);
            color: white;
            padding: 30px 50px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            margin-bottom: 0;
            font-size: 17px;
        }

        .container {
            width: 92%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn,
        .refresh-btn {
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .back-btn {
            background: #333;
        }

        .refresh-btn {
            background: #d32f2f;
        }

        .requests {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .request-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-left: 6px solid #d32f2f;
        }

        .request-card h2 {
            margin-top: 0;
            color: #b71c1c;
        }

        .request-id {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .blood-group {
            display: inline-block;
            background: #ffe5e5;
            color: #b71c1c;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 7px 13px;
            border-radius: 20px;
            font-weight: bold;
        }

        .details p {
            margin: 11px 0;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .approve,
        .reject {
            flex: 1;
            border: none;
            padding: 13px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .approve {
            background: #16a34a;
        }

        .approve:hover {
            background: #15803d;
        }

        .reject {
            background: #dc2626;
        }

        .reject:hover {
            background: #b91c1c;
        }

        .empty {
            background: white;
            padding: 60px 20px;
            text-align: center;
            border-radius: 15px;
            color: #777;
            grid-column: 1 / -1;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 25px;
            border-radius: 12px;
            grid-column: 1 / -1;
        }

        @media(max-width: 700px) {

            header {
                padding: 25px;
            }

            .container {
                width: 94%;
            }

            .top-bar {
                gap: 10px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🩸 Blood Requests</h1>
    <p>Admin panel — review and manage hospital blood requests</p>
</header>

<div class="container">

    <div class="top-bar">

        <button
            class="back-btn"
            onclick="goBack()">
            ← Admin Dashboard
        </button>

        <button
            class="refresh-btn"
            onclick="loadRequests()">
            🔄 Refresh
        </button>

    </div>

    <h2>Pending Blood Requests</h2>

    <div
        id="requestsContainer"
        class="requests">

        <div class="empty">
            Loading blood requests...
        </div>

    </div>

</div>


<script>

const API_URL =
    "http://localhost:5000/api/blood-requests";


// ==========================================
// BACK TO ADMIN DASHBOARD
// ==========================================

function goBack() {

    window.location.href = "admin.html";

}


// ==========================================
// LOAD PENDING REQUESTS
// ==========================================

async function loadRequests() {

    const container =
        document.getElementById("requestsContainer");

    container.innerHTML = `
        <div class="empty">
            Loading blood requests...
        </div>
    `;

    try {

        const response = await fetch(
            `${API_URL}/pending`
        );

        const text = await response.text();

        console.log(
            "Pending requests response:",
            text
        );

        let requests = [];

        try {
            requests = JSON.parse(text);
        } catch {
            throw new Error(
                "Backend returned invalid JSON."
            );
        }

        if (!response.ok) {

            throw new Error(
                requests.message ||
                `Server error: ${response.status}`
            );
        }

        displayRequests(requests);

    } catch (error) {

        console.error(
            "Load requests error:",
            error
        );

        container.innerHTML = `
            <div class="error">

                <h2>❌ Failed to fetch</h2>

                <p>
                    ${error.message}
                </p>

                <p>
                    Make sure the Java backend is running
                    on port 5000.
                </p>

            </div>
        `;
    }
}


// ==========================================
// DISPLAY REQUESTS
// ==========================================

function displayRequests(requests) {

    const container =
        document.getElementById("requestsContainer");

    if (!requests || requests.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <h2>✅ No Pending Requests</h2>

                <p>
                    There are currently no blood requests
                    waiting for approval.
                </p>

            </div>
        `;

        return;
    }


    container.innerHTML = "";


    requests.forEach(request => {

        const card =
            document.createElement("div");

        card.className =
            "request-card";


        const hospital =
            request.hospitalName ||
            request.hospital ||
            "Not provided";


        const patient =
            request.patientName ||
            request.name ||
            "Not provided";


        const age =
            request.age ??
            "Not provided";


        const gender =
            request.gender ||
            "Not provided";


        const patientStatus =
            request.patientStatus ||
            request.priority ||
            "Not provided";


        const bloodGroup =
            request.bloodGroup ||
            "Not provided";


        const units =
            request.unitsRequired ??
            "Not provided";


        const phone =
            request.phone ||
            request.contactNumber ||
            "Not provided";


        const city =
            request.city ||
            "Not provided";


        const reason =
            request.reason ||
            request.notes ||
            "Not provided";


        card.innerHTML = `

            <div class="request-id">
                Request ID: #${request.id}
            </div>

            <h2>
                🏥 ${escapeHtml(hospital)}
            </h2>

            <div class="blood-group">
                🩸 ${escapeHtml(bloodGroup)}
            </div>

            <div class="details">

                <p>
                    <strong>Patient:</strong>
                    ${escapeHtml(patient)}
                </p>

                <p>
                    <strong>Age:</strong>
                    ${escapeHtml(age)}
                </p>

                <p>
                    <strong>Gender:</strong>
                    ${escapeHtml(gender)}
                </p>

                <p>
                    <strong>Patient Status:</strong>
                    ${escapeHtml(patientStatus)}
                </p>

                <p>
                    <strong>Blood Units:</strong>
                    ${escapeHtml(units)}
                </p>

                <p>
                    <strong>City:</strong>
                    ${escapeHtml(city)}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${escapeHtml(phone)}
                </p>

                <p>
                    <strong>Reason:</strong>
                    ${escapeHtml(reason)}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="status">
                        ${escapeHtml(request.status || "Pending")}
                    </span>
                </p>

            </div>

            <div class="buttons">

                <button
                    class="approve"
                    onclick="approveRequest(${request.id})">

                    ✓ Approve

                </button>

                <button
                    class="reject"
                    onclick="rejectRequest(${request.id})">

                    ✕ Reject

                </button>

            </div>
        `;


        container.appendChild(card);

    });
}


// ==========================================
// APPROVE REQUEST
// ==========================================

async function approveRequest(id) {

    if (!confirm(
        "Approve this blood request?"
    )) {
        return;
    }


    try {

        const response = await fetch(
            `${API_URL}/approve/${id}`,
            {
                method: "PUT"
            }
        );


        const text =
            await response.text();


        let result = {};

        try {
            result = JSON.parse(text);
        } catch {
            result = {};
        }


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Approval failed: ${response.status}`
            );
        }


        alert(
            result.message ||
            "Blood request approved successfully!"
        );


        loadRequests();

    } catch (error) {

        console.error(
            "Approve error:",
            error
        );

        alert(
            "❌ " + error.message
        );
    }
}


// ==========================================
// REJECT REQUEST
// ==========================================

async function rejectRequest(id) {

    if (!confirm(
        "Reject this blood request?"
    )) {
        return;
    }


    try {

        const response = await fetch(
            `${API_URL}/reject/${id}`,
            {
                method: "PUT"
            }
        );


        const text =
            await response.text();


        let result = {};

        try {
            result = JSON.parse(text);
        } catch {
            result = {};
        }


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Rejection failed: ${response.status}`
            );
        }


        alert(
            result.message ||
            "Blood request rejected successfully!"
        );


        loadRequests();

    } catch (error) {

        console.error(
            "Reject error:",
            error
        );

        alert(
            "❌ " + error.message
        );
    }
}


// ==========================================
// BASIC HTML SAFETY
// ==========================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// ==========================================
// LOAD PAGE
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    loadRequests
);

</script>

</body>
</html>
