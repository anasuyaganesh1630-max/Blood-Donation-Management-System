<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="top-nav">
    <button onclick="goBack()">
        ← Back
    </button>
</div>
<div class="register-section">

    <div class="register-card">

        <h2>🩸 Donor Registration</h2>

        <p class="register-info">
            Register as a blood donor. Your registration will be
            reviewed by the administrator.
        </p>

        <form id="donorRegistrationForm">

    <input type="text" id="name" placeholder="Full Name" required>

    <input type="email" id="email" placeholder="Email" required>

    <input type="number" id="age" placeholder="Age" required>

    <select id="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <select id="blood_group" required>
        <option value="">Select Blood Group</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>
    </select>

    <select id="city" required>
        <option value="">Select District</option>
        <option>Kollam</option>
        <option>Thiruvananthapuram</option>
        <option>Pathanamthitta</option>
        <option>Alappuzha</option>
        <option>Kottayam</option>
        <option>Idukki</option>
        <option>Ernakulam</option>
        <option>Thrissur</option>
        <option>Palakkad</option>
        <option>Malappuram</option>
        <option>Kozhikode</option>
        <option>Wayanad</option>
        <option>Kannur</option>
        <option>Kasaragod</option>
    </select>

    <input type="text" id="phone" placeholder="Phone Number" required>

    <button type="submit">
        🩸 Register as Donor
    </button>

    <!-- MESSAGE -->
    <p id="donorMessage"></p>

</form>

    </div>

</div>
<script>
function goBack() {
    window.location.href = "index.html";
}
document
.getElementById("donorRegistrationForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message =
        document.getElementById("donorMessage");

    message.innerText = "Submitting registration...";
    message.style.color = "#333";

    const donorData = {

        name:
            document.getElementById("name").value.trim(),

        email:
            document.getElementById("email").value.trim(),

        age:
            document.getElementById("age").value,

        gender:
            document.getElementById("gender").value,

        bloodGroup:
            document.getElementById("blood_group").value,

        city:
            document.getElementById("city").value,

        phone:
            document.getElementById("phone").value.trim()
    };

    console.log("Sending donor data:", donorData);

    try {

        const response = await fetch(
            "http://localhost:5000/api/donors/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(donorData)
            }
        );

        const data = await response.json();

        console.log("Server response:", data);

        if (response.ok) {

            message.innerText =
                data.message ||
                "Donor registration submitted successfully.";

            message.style.color = "green";

            document
                .getElementById("donorRegistrationForm")
                .reset();

        } else {

            message.innerText =
                data.message ||
                "Donor registration failed.";

            message.style.color = "red";
        }

    } catch (error) {

        console.error("Registration error:", error);

        message.innerText =
            "Cannot connect to server. Please make sure the backend is running.";

        message.style.color = "red";
    }

});

</script>
</body>
</html>
