<!DOCTYPE html>
<html>
<head>
    <title>Hospital Admin Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="top-nav">
    <button onclick="goBack()">
        ← Back
    </button>
</div>
<div class="drop drop1">🩸</div>
<div class="drop drop2">🩸</div>
<div class="drop drop3">🩸</div>
<div class="login-container">

    <div class="login-card">

        <div class="icon">
            🩸
        </div>

        <h1>Hospital Admin</h1>

        <p id="typing"></p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>
<div id="loader" class="loader"></div>
<div id="successMsg">
    ✅ Login Successful
</div>
        <div class="extra">

            <span>
                <i class="fa-solid fa-heart"></i>
                Save Lives
            </span>

            <span>
                <i class="fa-solid fa-shield-heart"></i>
                Secure Access
            </span>

        </div>

    </div>

</div>

<script>
function goBack() {
    window.location.href = "index.html";
}
function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    if(
        username === "admin" &&
        password === "admin123"
    ){

        document.getElementById("loader")
        .style.display = "block";

        document.getElementById("successMsg")
        .style.display = "block";

        setTimeout(() => {

            window.location.href =
            "admin.html";

        }, 2500);

    }
    else{

        alert("Invalid Login");

    }

}
const text =
"Blood Donation Management System";

let i = 0;

function typeText(){

    if(i < text.length){

        document.getElementById("typing")
        .innerHTML += text.charAt(i);

        i++;

        setTimeout(typeText,80);

    }

}

typeText();
</script>
<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;


        const message =
            document.getElementById("loginMessage");


        message.innerText =
            "Logging in...";

        message.style.color = "#333";


        try {

            const response = await fetch(
                "http://localhost:5000/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const data =
                await response.json();


            console.log(
                "Login response:",
                data
            );


            // =====================================
            // LOGIN FAILED
            // =====================================

            if (!response.ok) {

                message.innerText =
                    data.message ||
                    "Login failed.";

                message.style.color = "red";

                return;
            }


            // =====================================
            // LOGIN SUCCESSFUL
            // =====================================

            message.innerText =
                "Login successful!";

            message.style.color = "green";


            // =====================================
            // SAVE USER INFORMATION
            // =====================================

            localStorage.setItem(
                "userId",
                data.id
            );

            localStorage.setItem(
                "userName",
                data.name
            );

            localStorage.setItem(
                "userEmail",
                data.email
            );

            localStorage.setItem(
                "userRole",
                data.role
            );

            localStorage.setItem(
                "userStatus",
                data.status
            );


            // =====================================
            // REDIRECT BASED ON ROLE
            // =====================================

            setTimeout(function() {

                if (
                    data.role &&
                    data.role.toLowerCase() === "admin"
                ) {

                    window.location.href =
                        "admin.html";

                }

                else if (
                    data.role &&
                    data.role.toLowerCase() === "donor"
                ) {

                    window.location.href =
                        "donor.html";

                }

                else if (
                    data.role &&
                    data.role.toLowerCase() === "hospital"
                ) {

                    window.location.href =
                        "hospital.html";

                }

                else {

                    message.innerText =
                        "Login successful, but no dashboard is configured for this role.";

                }

            }, 500);


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.innerText =
                "Cannot connect to Java backend. Make sure Spring Boot is running.";

            message.style.color = "red";

        }

    });

</script>
</body>
</html>
