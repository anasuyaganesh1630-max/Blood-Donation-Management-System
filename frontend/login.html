<!DOCTYPE html>
<html>
<head>
    <title>Hospital Admin Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="drop drop1">🩸</div>
<div class="drop drop2">🩸</div>
<div class="drop drop3">🩸</div>
<div class="login-container">

    <div class="login-card">

        <div class="icon">
            🩸
        </div>

        <h1>Hospital Admin</h1>

        <p id="typing"></p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>
<div id="loader" class="loader"></div>
<div id="successMsg">
    ✅ Login Successful
</div>
        <div class="extra">

            <span>
                <i class="fa-solid fa-heart"></i>
                Save Lives
            </span>

            <span>
                <i class="fa-solid fa-shield-heart"></i>
                Secure Access
            </span>

        </div>

    </div>

</div>

<script>

function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    if(
        username === "admin" &&
        password === "admin123"
    ){

        document.getElementById("loader")
        .style.display = "block";

        document.getElementById("successMsg")
        .style.display = "block";

        setTimeout(() => {

            window.location.href =
            "admin.html";

        }, 2500);

    }
    else{

        alert("Invalid Login");

    }

}
const text =
"Blood Donation Management System";

let i = 0;

function typeText(){

    if(i < text.length){

        document.getElementById("typing")
        .innerHTML += text.charAt(i);

        i++;

        setTimeout(typeText,80);

    }

}

typeText();
</script>
<script>

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("http://localhost:5000/api/login/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const data = await response.json();
        if (data.user.role === "hospital") {

    localStorage.setItem(
        "hospitalName",
        data.user.name
    );

    window.location.href = "hospitals.html";
}

        if (!response.ok) {
            alert(data.message);
            return;
        }

        // Save logged-in user
        localStorage.setItem("user", JSON.stringify(data.user));

        // Redirect according to role
        if (data.user.role === "admin") {

            window.location.href = "admin.html";

        } else if (data.user.role === "donor") {

            window.location.href = "donor.html";

        } else if (data.user.role === "hospital") {

            window.location.href = "hospital.html";

        }

    } catch (error) {

        console.error(error);
        alert("Cannot connect to server");

    }

});

</script>
</body>
</html>
